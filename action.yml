name: Comment command gate
description: Mitigates GitHub Actions "pwn request" attacks on issue_comment slash commands such as /deploy. Stops a fork PR's code from running with repo secrets. Checks in order and stops at the first failure - the comment starts with the command, the commenter has at least the required repo role, and (optionally) the PR is open and its head branch is in this repo. Exits 0 if the command may run, 1 if not.

# The checks run cheapest first, so most refusals cost no API calls. The logic is in gate.sh.
# Call it from a job triggered by issue_comment (created), and filter the
# command in that job's `if:` too. See README.md for an example.

inputs:
  token:
    description: Token for gh, usually github.token. Needs issues write, and pull-requests write if the PR checks run.
    required: true
  repository:
    description: The repo the comment is in, usually github.repository
    required: true
  issue_number:
    description: The issue or PR number, usually github.event.issue.number
    required: true
  comment_id:
    description: The comment that ran the command, usually github.event.comment.id
    required: true
  comment_body:
    description: The comment text, usually github.event.comment.body
    required: true
  commenter:
    description: The login of whoever typed the command, usually github.event.comment.user.login
    required: true
  command:
    description: The command the comment must start with, e.g. /deploy
    required: true
  min_role:
    description: The lowest repo role allowed to run the command. One of admin, maintain, write, triage, read.
    required: false
    default: write
  require_pull_request:
    description: "true to refuse unless the comment is on an open pull request"
    required: false
    default: "false"
  require_same_repo_branch:
    description: "true to refuse PRs whose head branch is not in this repo, including PRs whose fork was deleted. Implies require_pull_request."
    required: false
    default: "false"
  deny_message:
    description: Comment posted when the commenter's role is too low. {commenter}, {command} and {role} are replaced. Empty to post nothing.
    required: false
    default: "🛑 Sorry @{commenter} - `{command}` needs {role} access to this repo."
  refuse_message:
    description: Comment posted when the PR is refused. {commenter}, {command} and {reason} are replaced. Empty to post nothing.
    required: false
    default: "🛑 Sorry @{commenter} - `{command}` can't run on this PR because {reason}."
  reaction:
    description: Reaction added to the comment when the command is allowed. Empty to skip.
    required: false
    default: "+1"

outputs:
  permission:
    description: The commenter's role in the repo
    value: ${{ steps.gate.outputs.permission }}
  head_ref:
    description: The PR's head branch name. Empty unless the PR checks ran.
    value: ${{ steps.gate.outputs.head_ref }}
  head_sha:
    description: The PR's head commit SHA. Empty unless the PR checks ran.
    value: ${{ steps.gate.outputs.head_sha }}
  head_repository:
    description: The PR's head repo full name. Empty if the PR checks did not run or the fork was deleted.
    value: ${{ steps.gate.outputs.head_repository }}

runs:
  using: composite
  steps:
    - name: Gate command
      id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repository }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        COMMENT_ID: ${{ inputs.comment_id }}
        COMMENT_BODY: ${{ inputs.comment_body }}
        COMMENTER: ${{ inputs.commenter }}
        COMMAND: ${{ inputs.command }}
        MIN_ROLE: ${{ inputs.min_role }}
        REQUIRE_PR: ${{ inputs.require_pull_request }}
        REQUIRE_SAME_REPO: ${{ inputs.require_same_repo_branch }}
        DENY_MESSAGE: ${{ inputs.deny_message }}
        REFUSE_MESSAGE: ${{ inputs.refuse_message }}
        REACTION: ${{ inputs.reaction }}
      run: bash "$GITHUB_ACTION_PATH/gate.sh"
