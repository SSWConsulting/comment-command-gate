name: Comment command gate
description: Gate a slash command typed in an issue or PR comment, such as /deploy. Checks in order and stops at the first failure - the comment starts with the command, the commenter has at least the required repo role, and (optionally) the comment is on an open PR from a branch in this repo. Exits 0 if the command may run, 1 if not. A refusal posts a comment saying why.

# The checks run cheapest first, so most refusals cost no API calls.
# Call it from a job triggered by issue_comment (created), and filter the
# command in that job's `if:` too. See README.md for an example.

inputs:
  token:
    description: Token for gh, usually github.token. Needs issues write, and pull-requests write if the PR checks run.
    required: true
  repository:
    description: The repo the comment is in, usually github.repository
    required: true
  issue_number:
    description: The issue or PR number, usually github.event.issue.number
    required: true
  comment_id:
    description: The comment that ran the command, usually github.event.comment.id
    required: true
  comment_body:
    description: The comment text, usually github.event.comment.body
    required: true
  commenter:
    description: The login of whoever typed the command, usually github.event.comment.user.login
    required: true
  command:
    description: The command the comment must start with, e.g. /deploy
    required: true
  min_role:
    description: The lowest repo role allowed to run the command. One of admin, maintain, write, triage, read.
    required: false
    default: write
  require_pull_request:
    description: "true to refuse unless the comment is on an open pull request"
    required: false
    default: "false"
  require_same_repo_branch:
    description: "true to refuse PRs whose head branch is not in this repo, including PRs whose fork was deleted. Implies require_pull_request."
    required: false
    default: "false"
  deny_message:
    description: Comment posted when the commenter's role is too low. {commenter}, {command} and {role} are replaced.
    required: false
    default: "🛑 Sorry @{commenter} - `{command}` needs {role} access to this repo."
  refuse_message:
    description: Comment posted when the PR is refused. {commenter}, {command} and {reason} are replaced.
    required: false
    default: "🛑 Sorry @{commenter} - `{command}` can't run on this PR because {reason}."
  reaction:
    description: Reaction added to the comment when the command is allowed. Empty to skip.
    required: false
    default: "+1"

outputs:
  permission:
    description: The commenter's role in the repo
    value: ${{ steps.gate.outputs.permission }}
  head_ref:
    description: The PR's head branch name. Empty unless the PR checks ran.
    value: ${{ steps.gate.outputs.head_ref }}
  head_sha:
    description: The PR's head commit SHA. Empty unless the PR checks ran.
    value: ${{ steps.gate.outputs.head_sha }}
  head_repository:
    description: The PR's head repo full name. Empty if the PR checks did not run or the fork was deleted.
    value: ${{ steps.gate.outputs.head_repository }}

runs:
  using: composite
  steps:
    - name: Gate command
      id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repository }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        COMMENT_ID: ${{ inputs.comment_id }}
        COMMENT_BODY: ${{ inputs.comment_body }}
        COMMENTER: ${{ inputs.commenter }}
        COMMAND: ${{ inputs.command }}
        MIN_ROLE: ${{ inputs.min_role }}
        REQUIRE_PR: ${{ inputs.require_pull_request }}
        REQUIRE_SAME_REPO: ${{ inputs.require_same_repo_branch }}
        DENY_MESSAGE: ${{ inputs.deny_message }}
        REFUSE_MESSAGE: ${{ inputs.refuse_message }}
        REACTION: ${{ inputs.reaction }}
      run: |
        set -euo pipefail

        # Role ranks, highest first. Unknown roles rank 0.
        rank() {
          case "$1" in
            admin) echo 5 ;;
            maintain) echo 4 ;;
            write) echo 3 ;;
            triage) echo 2 ;;
            read) echo 1 ;;
            *) echo 0 ;;
          esac
        }

        # Fill the {placeholders} in a message. $1 is the template, $2 the reason.
        fill() {
          local s=$1
          s=${s//'{commenter}'/$COMMENTER}
          s=${s//'{command}'/$COMMAND}
          s=${s//'{role}'/$MIN_ROLE}
          s=${s//'{reason}'/${2:-}}
          printf '%s' "$s"
        }

        comment() {
          gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$1" --silent
        }

        if [ "$(rank "$MIN_ROLE")" -eq 0 ]; then
          echo "::error::min_role must be one of admin, maintain, write, triage, read - got '$MIN_ROLE'."
          exit 1
        fi

        # 1. The comment must start with the command. No API call needed.
        if [[ "$COMMENT_BODY" != "$COMMAND"* ]]; then
          echo "::error::The comment does not start with $COMMAND."
          exit 1
        fi

        # 2. The commenter must have at least the required role
        permission=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq '.permission' 2>/dev/null || echo none)
        echo "permission=$permission" >> "$GITHUB_OUTPUT"
        if [ "$(rank "$permission")" -lt "$(rank "$MIN_ROLE")" ]; then
          comment "$(fill "$DENY_MESSAGE")"
          echo "::error::$COMMENTER has '$permission' permission - $COMMAND needs $MIN_ROLE."
          exit 1
        fi
        echo "✅ $COMMENTER has '$permission' permission."

        # 3. Optional: the comment must be on an open PR, from a branch in this repo
        if [ "$REQUIRE_PR" = "true" ] || [ "$REQUIRE_SAME_REPO" = "true" ]; then
          if ! gh api "repos/$REPO/pulls/$ISSUE_NUMBER" >/dev/null 2>&1; then
            echo "::error::$COMMAND only runs on pull requests - #$ISSUE_NUMBER is not one."
            exit 1
          fi
          IFS=$'\t' read -r state head_ref head_sha head_repo < <(
            gh api "repos/$REPO/pulls/$ISSUE_NUMBER" \
              --jq '[.state, .head.ref, .head.sha, (.head.repo.full_name // "")] | @tsv'
          )
          if [ "$state" != "open" ]; then
            echo "::error::PR #$ISSUE_NUMBER is not open (state: $state) - $COMMAND can't run."
            exit 1
          fi
          if [ "$REQUIRE_SAME_REPO" = "true" ] && [ "$head_repo" != "$REPO" ]; then
            if [ -z "$head_repo" ]; then reason="its fork was deleted"; else reason="it comes from the fork $head_repo"; fi
            comment "$(fill "$REFUSE_MESSAGE" "$reason")"
            echo "::error::$COMMAND refused: $reason. It only runs for branches in $REPO."
            exit 1
          fi
          {
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
            echo "head_repository=$head_repo"
          } >> "$GITHUB_OUTPUT"
        fi

        # 4. Allowed. Acknowledge it. A missing reaction scope must not stop the command.
        if [ -n "$REACTION" ]; then
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="$REACTION" --silent \
            || echo "::warning::Could not add the reaction to the command."
        fi

        echo "✅ $COMMAND allowed for $COMMENTER on #$ISSUE_NUMBER"
